<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlansia RPG</title>
    <meta name="description" content="A scalable Three.js open-world first-person forest game engine.">
    <style>
        /* ── Reset ──────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ── Canvas ─────────────────────────────────────────── */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Old overlay (hidden, replaced by main menu) ──── */
        #overlay {
            display: none !important;
        }

        /* ── Animation keyframes ────────────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>
    <!-- Game canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Hidden overlay (kept for backward compat) -->
    <div id="overlay" class="hidden"></div>

    <!-- Three.js import map (ESM CDN) -->
    <script type="importmap">
    {
        "imports": {
            "three": "./src/libs/three-compat.js"
        }
    }
    </script>

    <!-- Engine entry point -->
    <script type="module" src="./src/main.js"></script>
</body>

</html>
